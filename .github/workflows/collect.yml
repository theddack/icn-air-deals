name: collect

on:
  schedule:
    # KST 07·12·18·22시 17분 (UTC 22·03·09·13시). 2026-10-15~20 정각 예약은 1.5~5시간 늦었고 18시 회차는 자주 빠졌다.
    # GitHub 안내대로 혼잡한 정각을 피해 17분에 둔다 (효과는 이후 실행 시각으로 확인)
    - cron: "17 22,3,9,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "site/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest -v

      - name: Collect
        run: python -m collector.main

      # 인천공항 출발 시간표. 키가 없거나 API가 실패해도 행사 수집·배포는 계속한다 (이전 flights.json 유지)
      - name: Collect flights
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m collector.flights

      # Secret Flying 공개 특가 중 서울 출발 (하루 1번만 받는다). 실패해도 이전 파일을 두고 계속한다
      - name: Collect Secret Flying
        run: python -m collector.secretflying

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 수집"
            # 수집 중에 코드 커밋이 올라오면 push가 거절된다(2026-10-20 2번). 실행은 concurrency로 한 번에 하나라
            # 다른 data 커밋과 겹치지 않으니 새 커밋 위에 다시 얹어서 올린다
            git pull --rebase origin main
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp data/deals.json _site/
          if [ -f data/flights.json ]; then cp data/flights.json _site/; fi
          if [ -f data/secretflying.json ]; then cp data/secretflying.json _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
