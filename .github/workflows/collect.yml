name: collect

on:
  schedule:
    # KST 07·12·18·22시 17분 (UTC 22·03·09·13시). 2026-10-15~20 정각 예약은 1.5~5시간 늦었고 18시 회차는 자주 빠졌다.
    # GitHub 안내대로 혼잡한 정각을 피해 17분에 둔다 (효과는 이후 실행 시각으로 확인)
    - cron: "17 22,3,9,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "site/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # 실행이 만들어진 시점의 커밋이 아니라 시작할 때의 최신 main을 받는다. concurrency로 기다린 실행이
      # 앞 실행의 data 커밋 없이 옛 파일로 수집하면 data push가 충돌난다 (2026-10-24 검토)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest -v

      # 항공사 뉴스레터(Gmail, 읽기 전용) → data/mail_articles.json. 발신 인증을 통과한 메일의 사실값만 남기고 본문·링크는
      # 저장하지 않는다. 로그에는 개수만. 계정이 없거나 실패해도 이전 파일을 두고 계속한다 (collector/mail_deals.py)
      - name: Collect airline mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m collector.mail_deals

      # 뉴스 검색이 전부 실패하면 collector.main이 1로 끝나고 deals.json을 그대로 둔다. 그래도 시간표·Secret Flying
      # 갱신과 배포는 계속하고 경고만 남긴다 (2026-10-25 검토). 화면은 마지막 수집 시각으로 오래됨을 알린다
      - name: Collect
        id: news
        continue-on-error: true
        run: python -m collector.main

      - name: Warn news failure
        if: steps.news.outcome == 'failure'
        run: echo "::warning::뉴스 수집이 실패해 행사 데이터는 이전 그대로입니다 (시간표·배포는 계속)"

      # 인천공항 출발 시간표. 키가 없거나 API가 실패해도 행사 수집·배포는 계속한다 (이전 flights.json 유지)
      - name: Collect flights
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m collector.flights

      # 땡처리닷컴 판매 중인 인천 출발 땡처리 항공권 (하루 1번만 받는다). 실패해도 이전 파일을 두고 계속한다
      - name: Collect ttang
        run: python -m collector.ttang

      # Secret Flying 공개 특가 중 서울 출발 (하루 1번만 받는다). 실패해도 이전 파일을 두고 계속한다
      - name: Collect Secret Flying
        run: python -m collector.secretflying

      # 텔레그램 알림은 따로 돈다 (.github/workflows/telegram.yml — 이 작업이 끝나면 이어서 실행).
      # 그 작업이 data/telegram_sent.json을 커밋하므로 여기서는 그 파일을 건드리지 않는다
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 수집"
            # 수집 중에 코드 커밋이 올라오면 push가 거절된다(2026-10-20 2번). 실행은 concurrency로 한 번에 하나이고
            # 최신 main에서 시작하므로 다른 data 커밋과 겹치지 않는다. 새 커밋 위에 다시 얹어서 올린다
            git pull --rebase origin main
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp data/deals.json _site/
          if [ -f data/flights.json ]; then cp data/flights.json _site/; fi
          if [ -f data/secretflying.json ]; then cp data/secretflying.json _site/; fi
          if [ -f data/ttang.json ]; then cp data/ttang.json _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
