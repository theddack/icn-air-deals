name: telegram

# 텔레그램 여행 할인 브리핑 (collector/notify.py). 시간대(KST 오전 09~14 · 오후 14~20 · 저녁 20~24시)마다 한 번,
# 보낼 것이 없으면 보내지 않는다. 0~9시에는 보내지 않는다.
#
# 언제 도는가
# - 예약: KST 09:07 · 14:07 · 20:07 (UTC 0·5·11시). Actions 예약은 1~5시간 늦거나 빠지기도 한다
# - 수집 작업(collect)이 끝날 때마다: 2026-10-20~26 기록상 수집은 실제로 KST 09:30 · 17:30 · 22:45쯤 끝난다.
#   예약만 쓰면 새 데이터보다 먼저 돌거나 늦어진다. 이미 보낸 시간대면 notify.py가 아무것도 하지 않는다.
#
# 수집 작업과 따로 돈다 (같은 concurrency 그룹이면 수집 몇 분씩 알림이 밀린다). 이 작업은 data/telegram_sent.json만
# 커밋하고 수집 작업은 그 파일을 건드리지 않아, 서로 먼저 올라온 커밋 위에 rebase해도 충돌하지 않는다.
on:
  schedule:
    - cron: "7 0,5,11 * * *"
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "보내지 않고 메시지만 로그에 출력 (dry-run)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 수집 작업이 막 올린 data 커밋까지 받도록 시작 시점의 최신 main
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python -m collector.notify

      # 보낸 기록 저장. 발송이 중간에 실패해도(위 단계 실패) 그때까지 보낸 기록은 올린다
      - name: Save sent log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_sent.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: 텔레그램 발송 기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          echo "::error::발송 기록을 올리지 못했습니다. 다음 실행에서 같은 항목을 다시 보낼 수 있습니다."
          exit 1
