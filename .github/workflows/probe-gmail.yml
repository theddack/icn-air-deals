name: probe-gmail

# Gmail 연결과 항공사 메일 현황 확인용. 계정은 Secrets에서 읽고, 로그에는 항공사별 메일 수·인증 통과 수와
# 발신 도메인만 남긴다 (scripts/probe_gmail.py). 잊지 않도록 월·수·금 아침에 자동으로도 돈다.
on:
  schedule:
    # KST 월·수·금 08시 23분 (UTC 일·화·목 23시). Actions 크론은 혼잡하면 수십 분 늦게 돈다.
    - cron: "23 23 * * 0,2,4"  # 정각 혼잡을 피해 23분
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠치 메일을 볼지"
        default: "30"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAYS: ${{ inputs.days }}
        # 예약 실행에는 inputs가 없어서 기본 30일
        run: python -m scripts.probe_gmail "${DAYS:-30}"
